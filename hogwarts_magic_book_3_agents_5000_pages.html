  </style>

    const SCENE_VARIATIONS = [
      { place: "Astronomy Tower", placeCn: "天文塔观星台", time: "under a silver crescent moon", timeCn: "在银色新月下" },
      { place: "Library Archive", placeCn: "图书馆密档室", time: "before the morning bell", timeCn: "在晨钟敲响前" },
      { place: "Greenhouse Three", placeCn: "第三温室玻璃房", time: "during a misty drizzle", timeCn: "在薄雾细雨中" },
      { place: "Clockwork Corridor", placeCn: "齿轮钟表长廊", time: "at precisely dusk", timeCn: "恰好在黄昏时分" },
      { place: "Owlery Loft", placeCn: "猫头鹰棚屋阁楼", time: "after a sudden gust of wind", timeCn: "在一阵突如其来的大风后" },
      { place: "Stone Courtyard", placeCn: "石砌中庭广场", time: "while lanterns glowed softly", timeCn: "当灯笼柔和地亮起时" },
      { place: "Alchemy Cellar", placeCn: "炼金地下室", time: "with a brass compass in hand", timeCn: "手里握着黄铜罗盘时" },
      { place: "Great Staircase", placeCn: "旋转大理石楼梯", time: "on a quiet Sunday morning", timeCn: "在一个安静的周日清晨" }
    ];

    const STORAGE_KEY = "hogwarts_book3_5000_state_v1";
    const defaultState = {
      currentPage: 1,
      mode: "story",
      xp: 0,
      hideCn: false,
      slowSpeech: false,
      completedPages: {},
      answeredQuizzes: {}
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? { ...defaultState, ...JSON.parse(raw) } : { ...defaultState };
      } catch (e) {
        return { ...defaultState };
      }
    }

    let state = loadState();
    let builderSelected = [];

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    // 根据页码 (1~5000) 动态生成专属内容，前5页为精编主线，6~5000页结合场景矩阵与跨卷词汇轮换
    function getPageContent(pageNum) {
      const p = Math.max(1, Math.min(TOTAL_PAGES, Number(pageNum) || 1));
      const volIdx = Math.floor((p - 1) / 1000); // 0..4
      const theme = CHAPTER_THEMES[volIdx];
      const pageInVol = ((p - 1) % 1000) + 1;

      if (p <= 5) {
        const directTheme = CHAPTER_THEMES[p - 1];
        return {
          page: p,
          vol: directTheme.vol,
          titleCn: directTheme.titleCn,
          titleEn: directTheme.titleEn,
          badge: directTheme.badge,
          mission: directTheme.mission,
          story: directTheme.coreStory,
          vocab: directTheme.vocab,
          quizzes: buildQuizzesForTheme(directTheme, p),
          builder: directTheme.builder,
          qa: directTheme.qa
        };
      }

      const scene = SCENE_VARIATIONS[(p * 7 + volIdx) % SCENE_VARIATIONS.length];
      const v0 = theme.vocab[p % theme.vocab.length];
      const v1 = theme.vocab[(p + 1) % theme.vocab.length];
      const v2 = theme.vocab[(p + 2) % theme.vocab.length];
      const crossTheme = CHAPTER_THEMES[(volIdx + (p % 4) + 1) % 5];
      const v3 = crossTheme.vocab[p % crossTheme.vocab.length];

      const dynamicStory = [
        {
          en: `Mission Log #${p}: In the ${scene.place}, ${scene.time}, the junior agents opened their field notebook.`,
          cn: `任务日志 #${p}：${scene.timeCn}，在${scene.placeCn}，小特工们翻开了外勤笔记本。`
        },
        {
          en: `Using "${v0.word}" (${v0.meaning}), Leo upgraded "${v0.basic}" into "${v0.pro}"`,
          cn: `运用进阶词“${v0.word}”（${v0.meaning}），里奥把普通表达升级成了地道句型。`
        },
        {
          en: `Next, they practiced "${v1.word}": ${v1.example}`,
          cn: `接着，他们练习了“${v1.word}”（${v1.meaning}）的实际情景用法。`
        },
        {
          en: `Finally, combining "${v2.word}" and "${v3.word}" helped them solve Case #${pageInVol} in Volume ${theme.vol}.`,
          cn: `最后，结合“${v2.word}”与“${v3.word}”，他们顺利破解了第 ${theme.vol} 卷的第 ${pageInVol} 号档案。`
        }
      ];

      const builderPool = [
        {
          prompt: `第 ${p} 页拼句挑战：把词块排成标准进阶句型`,
          tokens: v0.pro.split(" "),
          answer: v0.pro
        },
        {
          prompt: `第 ${p} 页拼句挑战：还原情景例句`,
          tokens: v1.example.split(" "),
          answer: v1.example
        }
      ];

      return {
        page: p,
        vol: theme.vol,
        titleCn: `${theme.titleCn} · 档案 #${pageInVol}`,
        titleEn: `${theme.titleEn} · File #${pageInVol}`,
        badge: `${theme.badge} Lv.${Math.ceil(pageInVol / 100)}`,
        mission: `${scene.placeCn}外勤训练：掌握 ${v0.word}、${v1.word}、${v2.word} 与跨卷词 ${v3.word}`,
        story: dynamicStory,
        vocab: [v0, v1, v2, v3],
        quizzes: buildQuizzesForTheme(theme, p, [v0, v1, v3]),
        builder: builderPool[p % builderPool.length],
        qa: [
          {
            prompt: `第 ${p} 页特工提问 1：请用本页核心词 "${v0.word}"（${v0.meaning}）口头或书面造一个句子。`,
            tip: `参考升级思路：${v0.basic} → ${v0.pro}`,
            model: v0.pro
          },
          {
            prompt: `第 ${p} 页特工提问 2：如何把跨卷词 "${v3.word}"（${v3.meaning}）放进一个完整英语句子里？`,
            tip: `提示词义：${v3.meaning}（${v3.pos}）`,
            model: v3.example
          }
        ]
      };
    }

    function buildQuizzesForTheme(theme, seed, customList) {
      const list = customList || theme.vocab.slice(0, 3);
      return list.map((item, idx) => {
        const distractors = theme.vocab.filter(x => x.word !== item.word);
        const d1 = distractors[(seed + idx) % distractors.length];
        const d2 = distractors[(seed + idx + 1) % distractors.length];
        const blankSentence = item.example.replace(new RegExp(item.word, "i"), "______");
        const rawOpts = [
          { word: item.word, ok: true, msg: `回答正确！"${item.word}" 意为“${item.meaning}”，放进句中非常地道！` },
          { word: d1.word, ok: false, msg: `再想想哦！"${d1.word}" 是“${d1.meaning}”，不符合这里的语境。` },
          { word: d2.word, ok: false, msg: `差点就对了！"${d2.word}" 意为“${d2.meaning}”，换一个试试。` }
        ];
        // 根据页码轮换选项顺序
        const shift = (seed + idx) % 3;
        const rotated = [rawOpts[shift], rawOpts[(shift + 1) % 3], rawOpts[(shift + 2) % 3]];
        const letters = ["A", "B", "C"];
        return {
          tag: `第 ${seed} 页 · 情景词汇第 ${idx + 1} 题`,
          q: `Choose the best word to complete the sentence: "${blankSentence}" (提示：${item.meaning})`,
          options: rotated.map((o, i) => ({
            label: `${letters[i]}. ${o.word}`,
            ok: o.ok,
            msg: o.msg
          }))
        };
      });
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      utter.rate = state.slowSpeech ? 0.78 : 1.0;
      window.speechSynthesis.speak(utter);
    }

    function markPageCompleted(p) {
      if (!state.completedPages[p]) {
        state.completedPages[p] = true;
        state.xp += 20;
      }
      saveState();
      renderHeaderStats();
    }

    function renderHeaderStats() {
      const doneCount = Object.keys(state.completedPages).length;
      document.getElementById("pageIndicator").textContent = `📄 第 ${state.currentPage} / ${TOTAL_PAGES} 页`;
      document.getElementById("xpBadge").textContent = `⚡ ${state.xp} XP`;
      document.getElementById("doneCountBadge").textContent = `✅ 已完成 ${doneCount} 页`;
      document.getElementById("toggleCnBtn").textContent = state.hideCn ? "👁️ 显示中文释义" : "🙈 隐藏中文释义";
      document.getElementById("rateBtn").textContent = state.slowSpeech ? "🐢 语速：慢速 (0.78x)" : "⚡ 语速：正常 (1.0x)";
      document.getElementById("pageJumpInput").value = state.currentPage;
      const volStart = Math.floor((state.currentPage - 1) / 1000) * 1000 + 1;
      document.getElementById("volumeSelect").value = String(volStart);
    }

    function renderModeTabs() {
      document.querySelectorAll(".mode-tab").forEach(tab => {
        tab.classList.toggle("active", tab.dataset.mode === state.mode);
        tab.onclick = () => {
          state.mode = tab.dataset.mode;
          saveState();
          renderModeTabs();
          renderPanel();
        };
      });
    }

    function renderPanel() {
      const data = getPageContent(state.currentPage);
      const panel = document.getElementById("learningPanel");
      let bodyHtml = "";

      if (state.mode === "story") {
        bodyHtml = data.story.map((line, idx) => {
          const plainEn = line.en.replace(/<\/?mark>/g, "");
          return `
            <div class="story-line">
              <div class="story-en">${idx + 1}. ${line.en}</div>
              <div class="story-cn ${state.hideCn ? "hidden" : ""}">${line.cn}</div>
              <button class="btn btn-sm" data-speak="${encodeURIComponent(plainEn)}">🔊 朗读本句</button>
            </div>
          `;
        }).join("");
      } else if (state.mode === "vocab") {
        bodyHtml = `<div class="vocab-grid">` + data.vocab.map(v => `
          <div class="vocab-card">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
              <div>
                <span class="vocab-word">${v.word}</span>
                <span class="vocab-phonetic">${v.phonetic} · ${v.pos}</span>
              </div>
              <button class="btn btn-sm" data-speak="${encodeURIComponent(v.word + ". " + v.example)}">🔊 听发音</button>
            </div>
            <div style="font-weight:600;">${v.meaning}</div>
            <div class="pro-upgrade-box">
              <span class="basic-txt">普通说法：${v.basic}</span>
              <span class="pro-txt">进阶地道：${v.pro}</span>
            </div>
            <div style="font-size:13.5px;color:#e2e8f0;background:rgba(255,255,255,0.04);padding:9px;border-radius:8px;">
              例句：${v.example}
            </div>
          </div>
        `).join("") + `</div>`;
      } else if (state.mode === "quiz") {
        bodyHtml = data.quizzes.map((qItem, qIdx) => {
          const qKey = `p${data.page}_q${qIdx}`;
          const savedChoice = state.answeredQuizzes[qKey];
          return `
            <div class="quiz-card">
              <div class="quiz-tag">${qItem.tag}</div>
              <div class="quiz-q">${qIdx + 1}. ${qItem.q}</div>
              <div class="quiz-options">
                ${qItem.options.map((opt, oIdx) => {
                  let cls = "opt-btn";
                  let disabled = "";
                  if (savedChoice !== undefined) {
                    disabled = "disabled";
                    if (oIdx === savedChoice) cls += opt.ok ? " correct" : " wrong";
                    else if (opt.ok) cls += " correct";
                  }
                  return `<button class="${cls}" ${disabled} data-qidx="${qIdx}" data-oidx="${oIdx}">${opt.label}</button>`;
                }).join("")}
              </div>
              <div class="feedback-box ${savedChoice !== undefined ? "show " + (qItem.options[savedChoice].ok ? "ok" : "err") : ""}">
                ${savedChoice !== undefined ? qItem.options[savedChoice].msg : ""}
              </div>
            </div>
          `;
        }).join("");
      } else if (state.mode === "builder") {
        const isDone = !!state.completedPages[data.page];
        const currentTokens = isDone ? data.builder.answer.split(" ") : builderSelected;
        bodyHtml = `
          <div class="quiz-card">
            <div class="quiz-q">${data.builder.prompt}</div>
            <div class="sentence-slot" id="sentenceSlot">
              ${currentTokens.length ? currentTokens.map((t, idx) => `<button class="token-btn" data-remove="${idx}">${t}</button>`).join("") : '<span style="color:var(--text-muted);font-size:13px;">点击下方词块拼出完整句子...</span>'}
            </div>
            <div class="token-pool" id="tokenPool">
              ${data.builder.tokens.map(t => {
                const usedCount = currentTokens.filter(x => x === t).length;
                const totalCount = data.builder.tokens.filter(x => x === t).length;
                const disabled = isDone || usedCount >= totalCount ? "disabled" : "";
                return `<button class="token-btn" ${disabled} data-token="${encodeURIComponent(t)}">${t}</button>`;
              }).join("")}
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <button class="btn btn-gold" id="checkBuilderBtn">✓ 校验咒语拼句</button>
              <button class="btn" id="clearBuilderBtn">清空重拼</button>
              <button class="btn" data-speak="${encodeURIComponent(data.builder.answer)}">🔊 朗读正确句子</button>
            </div>
            <div class="feedback-box ${isDone ? "show ok" : ""}" id="builderFeedback">
              ${isDone ? "本页拼句已完成！标准句型：" + data.builder.answer : ""}
            </div>
          </div>
        `;
      } else if (state.mode === "qa") {
        bodyHtml = data.qa.map((item, idx) => `
          <div class="qa-card">
            <div style="font-weight:700;color:var(--accent-gold);margin-bottom:6px;">${item.prompt}</div>
            <div style="font-size:13px;color:var(--text-muted);">${item.tip}</div>
            <input class="qa-input" type="text" placeholder="试着输入你的英文句子，或点击下方按钮查看参考与跟读..." />
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <button class="btn btn-sm btn-gold" data-toggle-model="model_${idx}">💡 查看参考表达</button>
              <button class="btn btn-sm" data-speak="${encodeURIComponent(item.model)}">🔊 朗读参考句</button>
            </div>
            <div class="qa-model" id="model_${idx}"><strong>参考表达：</strong>${item.model}</div>
          </div>
        `).join("");
      }

      panel.innerHTML = `
        <div class="panel-header">
          <div>
            <h2>第 ${data.page} 页 · ${data.titleCn}（${data.titleEn}）</h2>
            <div style="color:var(--text-muted);font-size:13.5px;">所属分卷：第 ${data.vol} 卷 · 本页勋章：🏅 ${data.badge}</div>
          </div>
          <div class="mission-badge">${data.mission}</div>
        </div>
        ${bodyHtml}
      `;

      panel.querySelectorAll("[data-speak]").forEach(btn => {
        btn.addEventListener("click", () => speak(decodeURIComponent(btn.dataset.speak)));
      });

      panel.querySelectorAll(".opt-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const qIdx = Number(btn.dataset.qidx);
          const oIdx = Number(btn.dataset.oidx);
          const qKey = `p${data.page}_q${qIdx}`;
          const first = state.answeredQuizzes[qKey] === undefined;
          state.answeredQuizzes[qKey] = oIdx;
          if (first && data.quizzes[qIdx].options[oIdx].ok) {
            state.xp += 10;
          }
          saveState();
          renderHeaderStats();
          renderPanel();
        });
      });

      const poolEl = document.getElementById("tokenPool");
      if (poolEl) {
        poolEl.querySelectorAll("[data-token]").forEach(btn => {
          btn.addEventListener("click", () => {
            builderSelected.push(decodeURIComponent(btn.dataset.token));
            renderPanel();
          });
        });
      }

      const slotEl = document.getElementById("sentenceSlot");
      if (slotEl) {
        slotEl.querySelectorAll("[data-remove]").forEach(btn => {
          btn.addEventListener("click", () => {
            builderSelected.splice(Number(btn.dataset.remove), 1);
            renderPanel();
          });
        });
      }

      const checkBtn = document.getElementById("checkBuilderBtn");
      if (checkBtn) {
        checkBtn.addEventListener("click", () => {
          const attempt = builderSelected.join(" ").trim();
          const fb = document.getElementById("builderFeedback");
          fb.classList.add("show");
          if (attempt === data.builder.answer) {
            fb.classList.remove("err");
            fb.classList.add("ok");
            fb.textContent = `拼句成功！本页通关 +20 XP！标准句型：${data.builder.answer}`;
            markPageCompleted(data.page);
          } else {
            fb.classList.remove("ok");
            fb.classList.add("err");
            fb.textContent = "词序还有一点小偏差，点“清空重拼”再试一次吧！";
          }
        });
      }

      const clearBtn = document.getElementById("clearBuilderBtn");
      if (clearBtn) {
        clearBtn.addEventListener("click", () => {
          delete state.completedPages[data.page];
          builderSelected = [];
          saveState();
          renderHeaderStats();
          renderPanel();
        });
      }

      panel.querySelectorAll("[data-toggle-model]").forEach(btn => {
        btn.addEventListener("click", () => {
          const el = document.getElementById(btn.dataset.toggleModel);
          if (el) el.classList.toggle("show");
        });
      });
    }

    function goToPage(targetPage) {
      const p = Math.max(1, Math.min(TOTAL_PAGES, Number(targetPage) || 1));
      state.currentPage = p;
      builderSelected = [];
      saveState();
      renderHeaderStats();
      renderPanel();
    }

    document.getElementById("prevPageBtn").addEventListener("click", () => goToPage(state.currentPage - 1));
    document.getElementById("nextPageBtn").addEventListener("click", () => goToPage(state.currentPage + 1));
    document.getElementById("goPageBtn").addEventListener("click", () => {
      goToPage(document.getElementById("pageJumpInput").value);
    });
    document.getElementById("pageJumpInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") goToPage(e.target.value);
    });
    document.getElementById("volumeSelect").addEventListener("change", (e) => {
      goToPage(Number(e.target.value));
    });
    document.getElementById("randomPageBtn").addEventListener("click", () => {
      goToPage(Math.floor(Math.random() * TOTAL_PAGES) + 1);
    });
    document.getElementById("toggleCnBtn").addEventListener("click", () => {
      state.hideCn = !state.hideCn;
      saveState();
      renderHeaderStats();
      renderPanel();
    });
    document.getElementById("rateBtn").addEventListener("click", () => {
      state.slowSpeech = !state.slowSpeech;
      saveState();
      renderHeaderStats();
    });
    document.getElementById("stopSpeechBtn").addEventListener("click", () => {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    });
    document.getElementById("resetProgressBtn").addEventListener("click", () => {
      state = { ...defaultState };
      builderSelected = [];
      saveState();
      renderHeaderStats();
      renderModeTabs();
      renderPanel();
    });

    renderHeaderStats();
    renderModeTabs();
    renderPanel();
  </script>
</body>
</html>
