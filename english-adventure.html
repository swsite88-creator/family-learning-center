panel>section:last-child{grid-column:auto}.story-art{height:104px}.art-mascot{width:65px;height:65px;font-size:34px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

const chapters=[
{id:'map',icon:'🗺️',name:'会发光的地图',scene:'Cloud Harbor · 云港',mascot:'🦊',title:'The Map That Moved',lines:['At Starling Port, Kai finds a glowing map.','The map changes when moonlight touches it.','It shows three islands, but a strong wind is pushing their airship toward a wall of clouds.','Mina checks the compass. Pip, a tiny fox-shaped robot, notices a silver mark.','“The safest island may be the right clue,” says Kai.','They must choose a route before the bell rings.'],cn:'在星港，凯发现一张会发光的地图。月光照到它时，地图就会改变。地图上有三座岛，但强风正把飞艇吹向云墙。米娜查看指南针，小狐狸机器人皮普发现了一个银色标记。“最安全的岛也许就是线索。”凯说。他们必须在钟声响起前选好路线。',words:[['glowing','/ˈɡləʊɪŋ/','发光的'],['compass','/ˈkʌmpəs/','指南针'],['notice','/ˈnəʊtɪs/','注意到'],['route','/ruːt/','路线']],q:'What does Pip notice on the map?',opts:['A silver mark','A red boat','A sleeping bird'],ok:0,why:'故事里说 Pip notices a silver mark。',sentence:'Kai checks the map before choosing a safe route.'},
{id:'rain',icon:'🌧️',name:'雨中的信号灯',scene:'Misty Bridge · 雾桥',mascot:'🐸',title:'The Lantern in the Rain',lines:['Mira hears a soft beep near the old bridge.','A small lantern begins to flicker in the rain.','She finds a wet puppy under a wooden bench.','Mira carries it to a dry shelter and uses the lantern to send a signal.','Soon, the puppy’s family follows the warm light home.'],cn:'米拉在旧桥附近听见轻轻的提示音。一盏小灯笼在雨中闪烁。她在木凳下发现一只淋湿的小狗。米拉把它带到干燥的避雨处，用灯笼发出信号。不久，小狗的家人跟着温暖的灯光找到了它。',words:[['flicker','/ˈflɪkə(r)/','闪烁'],['soaked','/səʊkt/','湿透的'],['shelter','/ˈʃeltə(r)/','遮蔽处；避难所'],['signal','/ˈsɪɡnəl/','信号']],q:'Where does Mira find the puppy?',opts:['Under a wooden bench','Inside a shop','On top of a tree'],ok:0,why:'短文说 Mira finds it under a wooden bench。',sentence:'Mira finds a wet puppy under the bench.'},
{id:'garden',icon:'🌱',name:'钟表花园',scene:'Clockwork Garden · 发条花园',mascot:'🐝',title:'The Garden That Woke Up',lines:['Every morning, the garden clock turns one small wheel.','Today, the wheel stops, and the flowers stay closed.','Jun hears a tiny click behind the stone path.','He finds a loose spring and gently puts it back.','The clock starts again, and the flowers open to the sun.'],cn:'每天早晨，花园时钟都会转动一个小齿轮。今天齿轮停住了，花朵也没有开放。俊听见石子路后面传来轻轻一声“咔哒”。他找到一根松脱的弹簧，轻轻把它装回去。时钟重新转动，花朵向着阳光开放。',words:[['wheel','/wiːl/','轮子；齿轮'],['loose','/luːs/','松动的'],['gently','/ˈdʒentli/','轻轻地'],['spring','/sprɪŋ/','弹簧；春天']],q:'What makes the garden clock start again?',opts:['Jun puts the loose spring back','The flowers sing a song','The sun pushes the clock'],ok:0,why:'Jun gently puts the loose spring back, and the clock starts again。',sentence:'Jun gently puts the loose spring back.'},
{id:'moon',icon:'🌙',name:'月球冰面挑战',scene:'Moonlight Rink · 月光冰场',mascot:'🐧',title:'A Race on the Moon',lines:['The moon rink is quiet and bright.','Nia checks the smooth ice before the race.','Her little robot glides too fast and loses its balance.','Nia changes the wheels and tries again.','This time, the robot moves slowly and reaches the silver flag.'],cn:'月球冰场安静又明亮。比赛前，妮娅检查光滑的冰面。她的小机器人滑得太快，失去了平衡。妮娅更换了轮子，再试一次。这一次，机器人移动得很慢，成功到达银色旗子旁。',words:[['smooth','/smuːð/','光滑的'],['glide','/ɡlaɪd/','滑行'],['balance','/ˈbæləns/','平衡'],['reach','/riːtʃ/','到达；够到']],q:'Why does the robot lose its balance?',opts:['It moves too fast','It is too quiet','It sees a flag'],ok:0,why:'故事写道：the robot glides too fast and loses its balance。',sentence:'The robot glides slowly across the smooth ice.'},
{id:'dragon',icon:'🐉',name:'口袋龙的约定',scene:'Pebble Valley · 卵石谷',mascot:'🐲',title:'A Promise for Pipkin',lines:['Pipkin is a tiny dragon with a fluffy green tail.','He finds a shiny button beside a garden gate.','Pipkin wants to keep it, but a note says “Lost and Found.”','He carries the button to the village desk.','The owner smiles, and Pipkin gets a warm berry pie.'],cn:'皮普金是一只尾巴毛茸茸的小龙。他在花园门边发现一颗闪亮的纽扣。皮普金很想留下它，但旁边有张纸条写着“失物招领”。他把纽扣送到村里的服务台。失主笑了，皮普金得到一块暖暖的莓果派。',words:[['fluffy','/ˈflʌfi/','毛茸茸的'],['shiny','/ˈʃaɪni/','闪亮的'],['owner','/ˈəʊnə(r)/','主人；所有者'],['promise','/ˈprɒmɪs/','承诺']],q:'What does Pipkin do with the button?',opts:['He takes it to the village desk','He hides it in a tree','He gives it to the dragon'],ok:0,why:'Pipkin carries the button to the village desk to return it。',sentence:'Pipkin returns the shiny button to its owner.'}
];
const KEY='family-english-adventure-v1';let progress={done:[],stars:0};try{progress=Object.assign(progress,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{};let current=0,chosen=[],quizRight=false,puzzleRight=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(progress));document.querySelector('#progress-pill').textContent=`⭐ 探险星星 ${progress.stars||0} · 故事 ${(progress.done||[]).length}/5`}
function say(text,rate=.88){if(!('speechSynthesis'in window)){toast('这台设备暂不支持网页朗读');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;speechSynthesis.speak(u)}
function toast(text){const t=document.querySelector('#toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function drawMap(){document.querySelector('#chapter-map').innerHTML=chapters.map((c,i)=>`<button class="chapter-stop ${current===i?'active':''} ${(progress.done||[]).includes(c.id)?'chapter-complete':''}" data-chapter="${i}"><span class="stop-icon">${c.icon}</span><span class="stop-name">${c.name}</span><span class="stop-state">${(progress.done||[]).includes(c.id)?'🌟 已收集':'第 '+(i+1)+' 站'}</span></button>`).join('');document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.chapter);quizRight=false;puzzleRight=false;chosen=[];render()})}
function render(){const c=chapters[current];drawMap();document.querySelector('#story-panel').innerHTML=`<div class="story-heading"><div><span class="story-kicker">STATION ${String(current+1).padStart(2,'0')} · ${esc(c.scene)}</span><h2>${esc(c.title)}</h2></div><button class="listen-all" id="listen-all">🔊 听完整故事</button></div><div class="story-art"><div class="art-mascot">${c.mascot}</div><div class="art-copy"><b>${esc(c.name)}任务开始！</b><p>点每句话旁边的喇叭听读。碰到不会的词，可以问词汇卡。</p></div></div><div class="story-lines">${c.lines.map((line,i)=>`<div class="story-line"><span>${esc(line)}</span><button class="say-line" data-line="${i}" aria-label="朗读第${i+1}句">🔊</button></div>`).join('')}</div><div class="action-row"><button class="soft-action" id="translation-toggle">🇨🇳 看中文提示</button><button class="soft-action" id="repeat-story">🔁 再听一次</button></div><div class="translation" id="translation" hidden>${esc(c.cn)}</div><div class="book-progress"><span>故事地图</span><div class="progress-track"><div class="progress-fill" style="width:${Math.round((progress.done||[]).length/chapters.length*100)}%"></div></div><span>${(progress.done||[]).length}/5</span></div>`;document.querySelector('#side-panel').innerHTML=`<section><h3>✨ 本关新词 · 点卡片听发音</h3><div class="vocab-list">${c.words.map((w,i)=>`<button class="vocab-card" data-vocab="${i}"><span class="vocab-top"><span class="vocab-word">${esc(w[0])}</span><span class="vocab-ipa">${esc(w[1])}</span></span><span class="vocab-clue">点一下揭晓意思</span><span class="vocab-meaning">${esc(w[2])}</span></button>`).join('')}</div></section><section class="quest-card"><h3>🕵️ 故事侦探题</h3><p>${esc(c.q)}</p><div class="answers">${c.opts.map((o,i)=>`<button class="answer" data-answer="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><p class="feedback" id="quiz-feedback" hidden></p></section><section class="puzzle-card"><p>🧩 拼出关键句</p><div class="puzzle-sentence" id="puzzle-sentence">点下面词块，排出正确句子。</div><div class="word-bank" id="word-bank"></div><div class="puzzle-actions"><button class="clear" id="clear-puzzle">重来</button><button id="check-puzzle">检查句子</button></div><p class="feedback" id="puzzle-feedback" hidden></p></section><button class="collect-button" id="collect-star" ${quizRight&&puzzleRight?'':'disabled'}>🌟 收集本关探险星</button>`;document.querySelector('#listen-all').onclick=()=>say(c.lines.join(' '));document.querySelector('#repeat-story').onclick=()=>say(c.lines.join(' '),.78);document.querySelectorAll('[data-line]').forEach(b=>b.onclick=()=>say(c.lines[Number(b.dataset.line)]));document.querySelector('#translation-toggle').onclick=()=>{const x=document.querySelector('#translation');x.hidden=!x.hidden};document.querySelectorAll('[data-vocab]').forEach(b=>b.onclick=()=>{const w=c.words[Number(b.dataset.vocab)];b.classList.toggle('open');say(w[0])});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const ok=Number(b.dataset.answer)===c.ok;quizRight=ok;document.querySelectorAll('[data-answer]').forEach(x=>{x.disabled=true;if(Number(x.dataset.answer)===c.ok)x.classList.add('correct')});const f=document.querySelector('#quiz-feedback');f.hidden=false;f.textContent=ok?'答对啦！'+c.why:'再听一次故事，留意关键词。'+c.why;f.style.color=ok?'#52765a':'#a45f4e';syncCollect()});const target=c.sentence.split(' '),pool=target.map((w,i)=>({w,i})).sort(()=>Math.random()-.5);document.querySelector('#word-bank').innerHTML=pool.map(x=>`<button class="word-chip" data-chip="${x.i}">${esc(x.w)}</button>`).join('');document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{if(b.disabled)return;b.disabled=true;chosen.push(Number(b.dataset.chip));document.querySelector('#puzzle-sentence').textContent=chosen.map(i=>target[i]).join(' ')});document.querySelector('#clear-puzzle').onclick=()=>{chosen=[];puzzleRight=false;document.querySelectorAll('[data-chip]').forEach(b=>b.disabled=false);document.querySelector('#puzzle-sentence').textContent='点下面词块，排出正确句子。';const f=document.querySelector('#puzzle-feedback');f.hidden=true;syncCollect()};document.querySelector('#check-puzzle').onclick=()=>{puzzleRight=chosen.length===target.length&&chosen.every((v,i)=>v===i);const f=document.querySelector('#puzzle-feedback');f.hidden=false;f.textContent=puzzleRight?'拼对啦！'+c.sentence:'顺序还不对，再试一试。';f.style.color=puzzleRight?'#52765a':'#a45f4e';if(puzzleRight)say(c.sentence);syncCollect()};document.querySelector('#collect-star').onclick=()=>{if(!quizRight||!puzzleRight)return;const fresh=!(progress.done||[]).includes(c.id);if(fresh){progress.done.push(c.id);progress.stars=(progress.stars||0)+1;recordCompletion(c.name)}save();toast(fresh?'星星收集成功！':'这一关已经收集过啦');drawMap();document.querySelector('#collect-star').textContent='✅ 已收集本关星星';document.querySelector('#collect-star').disabled=true;document.querySelector('.progress-fill').style.width=Math.round(progress.done.length/chapters.length*100)+'%'};if((progress.done||[]).includes(c.id)){document.querySelector('#collect-star').textContent='✅ 已收集本关星星';document.querySelector('#collect-star').disabled=true}}
function syncCollect(){document.querySelector('#collect-star').disabled=!(quizRight&&puzzleRight)}
function recordCompletion(name){try{const k='family-learning-center-v1',d=JSON.parse(localStorage.getItem(k)||'{"sessions":[],"mistakes":[],"streak":0,"lastStudy":null}'),date=new Date().toLocaleDateString('sv-SE'),yesterday=new Date(Date.now()-86400000).toLocaleDateString('sv-SE');d.sessions=d.sessions||[];d.sessions.push({date,minutes:10,subject:'英语冒险：'+name});d.streak=d.lastStudy===date?d.streak:(d.lastStudy===yesterday?(d.streak||0)+1:1);d.lastStudy=date;localStorage.setItem(k,JSON.stringify(d))}catch{}}
document.querySelector('#yearSelect')?.addEventListener('change',()=>{});render();
</script></body></html>
