<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>霍格沃茨四年级魔法英语互动书 · 10000页完整版</title>
  <style>
    :root {
      --bg-dark: #16120e;
      --parchment: #f7efe0;
      --parchment-2: #efe2c6;
      --ink: #241911;
      --ink-muted: #5b4634;
      --gold: #c9983b;
      --gold-bright: #e8be63;
      --crimson: #7f1d1d;
      --emerald: #14532d;
      --sapphire: #1e3a8a;
      --amber-soft: #fef3c7;
      --border: #cbb489;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at top, #2a2017 0%, var(--bg-dark) 75%);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.65;
    }

    .topbar {
      background: rgba(20, 15, 11, 0.94);
      color: var(--parchment);
      border-bottom: 2px solid var(--gold);
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: linear-gradient(135deg, var(--crimson), #450a0a);
      color: var(--gold-bright);
      border: 1px solid var(--gold);
      padding: 5px 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    .brand h1 {
      font-size: 17px;
      font-weight: 700;
      color: #fff6e5;
    }

    .topbar-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    .pill {
      background: rgba(255, 248, 231, 0.1);
      border: 1px solid rgba(232, 190, 99, 0.45);
      color: #fff3d6;
      padding: 5px 11px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    select, button {
      font-family: inherit;
      cursor: pointer;
    }

    .btn {
      background: linear-gradient(180deg, #f3d184, var(--gold));
      color: #231609;
      border: 1px solid #9b6f1e;
      border-radius: 8px;
      padding: 7px 13px;
      font-weight: 700;
      font-size: 13px;
      transition: transform 0.12s ease, filter 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-ghost {
      background: rgba(255, 248, 231, 0.12);
      color: #fff6e5;
      border: 1px solid rgba(232, 190, 99, 0.5);
    }

    .btn-small {
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    .layout {
      max-width: 1280px;
      margin: 22px auto;
      padding: 0 16px 40px;
      display: grid;
      grid-template-columns: 290px 1fr;
      gap: 20px;
    }

    @media (max-width: 920px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .sidebar {
      background: var(--parchment);
      border: 2px solid var(--gold);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow);
      height: fit-content;
      position: sticky;
      top: 76px;
      max-height: calc(100vh - 96px);
      overflow-y: auto;
    }

    @media (max-width: 920px) {
      .sidebar {
        position: static;
        max-height: none;
      }
    }

    .sidebar h2 {
      font-size: 15px;
      color: var(--crimson);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .year-select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fffdf8;
      color: var(--ink);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .unit-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .unit-item {
      text-align: left;
      background: #fffdf8;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12.5px;
      color: var(--ink);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .unit-item.active {
      background: linear-gradient(135deg, var(--crimson), #581111);
      color: #fff8e7;
      border-color: var(--gold);
      font-weight: 700;
    }

    .unit-item .pages-tag {
      font-size: 11px;
      opacity: 0.8;
      white-space: nowrap;
    }

    .page-jump-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      margin-top: 8px;
    }

    .page-dot-btn {
      padding: 5px 0;
      font-size: 11px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fffdf8;
      color: var(--ink);
      font-weight: 600;
    }

    .page-dot-btn.active {
      background: var(--gold);
      color: #1f1307;
      border-color: #8c6216;
    }

    .book-stage {
      background: linear-gradient(180deg, var(--parchment), var(--parchment-2));
      border: 3px solid var(--gold);
      border-radius: 16px;
      padding: 24px 28px;
      box-shadow: var(--shadow);
      min-height: 640px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    @media (max-width: 600px) {
      .book-stage {
        padding: 16px;
      }
    }

    .page-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 2px dashed var(--border);
      padding-bottom: 12px;
      margin-bottom: 18px;
    }

    .page-kicker {
      font-size: 12px;
      font-weight: 700;
      color: var(--crimson);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
      margin-top: 2px;
    }

    .page-num-box {
      background: #fffdf8;
      border: 1px solid var(--gold);
      border-radius: 10px;
      padding: 6px 12px;
      text-align: right;
      font-size: 12px;
    }

    .page-num-box strong {
      font-size: 16px;
      color: var(--crimson);
    }

    .illustration-card {
      background: #fffdf7;
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 18px;
      box-shadow: inset 0 0 24px rgba(201, 152, 59, 0.14);
    }

    .illustration-card svg {
      width: 100%;
      max-height: 250px;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    .scene-caption {
      margin-top: 8px;
      font-size: 12.5px;
      color: var(--ink-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .story-box {
      background: rgba(255, 253, 247, 0.85);
      border-left: 4px solid var(--crimson);
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .story-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .story-en {
      font-size: 16.5px;
      line-height: 1.8;
      color: #1c120b;
      margin-bottom: 10px;
    }

    .story-en .vocab-word {
      background: #fde68a;
      border-bottom: 2px solid #b45309;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
    }

    .story-cn {
      font-size: 13.5px;
      color: var(--ink-muted);
      background: #f6ebd4;
      padding: 10px 12px;
      border-radius: 8px;
      display: none;
    }

    .story-cn.show {
      display: block;
    }

    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .flip-card {
      background: #fffdf8;
      border: 1.5px solid var(--gold);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      position: relative;
    }

    .flip-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
    }

    .vocab-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .vocab-term {
      font-size: 18px;
      font-weight: 800;
      color: var(--crimson);
    }

    .vocab-phonetic {
      font-size: 12.5px;
      color: var(--ink-muted);
    }

    .vocab-clue {
      font-size: 12px;
      color: #92400e;
      background: var(--amber-soft);
      padding: 3px 8px;
      border-radius: 999px;
      display: inline-block;
      margin: 6px 0;
    }

    .vocab-example {
      font-size: 13.5px;
      color: var(--ink);
      margin-top: 4px;
    }

    .vocab-meaning {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      font-size: 13px;
      color: var(--emerald);
      font-weight: 700;
      display: none;
    }

    .flip-card.revealed .vocab-meaning {
      display: block;
    }

    .quiz-card {
      background: #fffdf8;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .quiz-q {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 10px;
      color: var(--ink);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .opt-btn {
      text-align: left;
      padding: 9px 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #faf3e3;
      color: var(--ink);
      font-size: 13.5px;
      transition: background 0.12s ease;
    }

    .opt-btn:hover {
      background: #f3e3bf;
    }

    .opt-btn.correct {
      background: #dcfce7;
      border-color: #15803d;
      color: #14532d;
      font-weight: 700;
    }

    .opt-btn.wrong {
      background: #fee2e2;
      border-color: #b91c1c;
      color: #7f1d1d;
    }

    .feedback-box {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.ok {
      background: #dcfce7;
      color: #14532d;
      border: 1px solid #86efac;
    }

    .feedback-box.no {
      background: #fef2f2;
      color: #7f1d1d;
      border: 1px solid #fca5a5;
    }

    .word-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 44px;
      padding: 10px;
      border-radius: 8px;
      background: #f7eed9;
      border: 1px dashed var(--border);
      margin-bottom: 10px;
    }

    .word-chip {
      background: #fffdf8;
      border: 1px solid var(--gold);
      border-radius: 7px;
      padding: 5px 11px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
    }

    .book-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-top: 2px solid var(--border);
      padding-top: 14px;
      margin-top: 18px;
    }

    .note-box {
      font-size: 12px;
      color: var(--ink-muted);
      background: rgba(255, 253, 247, 0.7);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-badge">HOGWARTS Y4 · 10000P</span>
      <h1>霍格沃茨四年级魔法英语互动书</h1>
    </div>
    <div class="topbar-controls">
      <span class="pill" id="pointsDisplay">🏆 学院积分：0 分</span>
      <span class="pill" id="progressDisplay">📖 已读页数：1 / 10000 页</span>
      <select id="voiceRate" class="pill" style="color:#fff3d6; background:rgba(255,248,231,0.14);">
        <option value="0.9" style="color:#1a120b;">🔊 正常语速 (0.9x)</option>
        <option value="0.72" style="color:#1a120b;">🐢 慢速跟读 (0.72x)</option>
      </select>
      <button class="btn btn-ghost btn-small" id="resetProgressBtn">重置进度</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h2>
        <span>魔法书架目录</span>
        <span style="font-size:11px; color:var(--ink-muted);">共 10000 页</span>
      </h2>
      <label for="yearSelect" style="font-size:12px; color:var(--ink-muted); display:block; margin-bottom:4px;">选择卷册：</label>
      <select id="yearSelect" class="year-select"></select>

      <div class="unit-list" id="unitList"></div>

      <div style="font-size:12px; color:var(--ink-muted); font-weight:700;">本单元页码跳转（每单元 10 页）：</div>
      <div class="page-jump-grid" id="pageJumpGrid"></div>
    </aside>

    <main class="book-stage" id="bookStage"></main>
  </div>

  <script>
const KEY="hogwarts_10k_v1";
const VOL=["Vol.1 对角巷与魔杖","Vol.2 站台与分院","Vol.3 魔法课堂","Vol.4 城堡密道","Vol.5 飞天扫帚赛场","Vol.6 神奇动物","Vol.7 魔药地窖","Vol.8 图书馆谜案","Vol.9 禁林探险","Vol.10 毕业魔法大会"];
const MODES=["魔法故事 · 第一幕","魔法故事 · 第二幕","魔法故事 · 第三幕","魔杖词汇工坊","阅读侦探闯关","魔法句型拼图","过去式魔药实验室","完形填空咒语","听写小测验","单元 Boss 挑战"];
const mk=(cat,rows,vb)=>rows.map(r=>vb?{cat,w:r[0],past:r[1],ipa:r[2],cn:r[3],ex:r[4]}:{cat,w:r[0],ipa:r[1],cn:r[2],ex:r[3]});
const W={
feel:mk("feel",[["nervous","/ˈnɜːvəs/","紧张的","Mia felt [nervous] before the big test."],["curious","/ˈkjʊəriəs/","好奇的","The [curious] kitten opened the box."],["proud","/praʊd/","自豪的","Dad was [proud] of his son."],["brave","/breɪv/","勇敢的","A [brave] girl saved the puppy."],["puzzled","/ˈpʌzld/","困惑的","Ben looked [puzzled] at the hard question."],["delighted","/dɪˈlaɪtɪd/","非常高兴的","We were [delighted] with the gift."],["worried","/ˈwʌrid/","担心的","Mum was [worried] about the storm."],["confident","/ˈkɒnfɪdənt/","自信的","Nina felt [confident] on the stage."]]),
desc:mk("desc",[["ancient","/ˈeɪnʃənt/","古老的","The [ancient] castle is very old."],["enormous","/ɪˈnɔːməs/","巨大的","An [enormous] whale swam by."],["shiny","/ˈʃaɪni/","闪亮的","She has a [shiny] new coin."],["mysterious","/mɪˈstɪəriəs/","神秘的","A [mysterious] noise came from the attic."],["dusty","/ˈdʌsti/","满是灰尘的","The [dusty] books were on the shelf."],["narrow","/ˈnærəʊ/","狭窄的","The path is [narrow]."],["silent","/ˈsaɪlənt/","寂静的","The night was [silent]."],["glowing","/ˈɡləʊɪŋ/","发光的","A [glowing] star appeared."]]),
obj:mk("obj",[["lantern","/ˈlæntən/","灯笼","Dad lit the [lantern]."],["scroll","/skrəʊl/","卷轴","The king read the [scroll]."],["compass","/ˈkʌmpəs/","指南针","The [compass] points north."],["crystal","/ˈkrɪstl/","水晶","The [crystal] sparkled in the sun."],["feather","/ˈfeðə(r)/","羽毛","A white [feather] fell down."],["mirror","/ˈmɪrə(r)/","镜子","She looked in the [mirror]."],["badge","/bædʒ/","徽章","He wears a school [badge]."],["cloak","/kləʊk/","斗篷","The wizard wore a long [cloak]."]]),
place:mk("place",[["tower","/ˈtaʊə(r)/","塔楼","We climbed the [tower]."],["corridor","/ˈkɒrɪdɔː(r)/","走廊","Do not run in the [corridor]."],["library","/ˈlaɪbrəri/","图书馆","I read books in the [library]."],["dungeon","/ˈdʌndʒən/","地牢","The [dungeon] was cold and dark."],["garden","/ˈɡɑːdn/","花园","Flowers grow in the [garden]."],["courtyard","/ˈkɔːtjɑːd/","庭院","Children played in the [courtyard]."]]),
creature:mk("creature",[["owl","/aʊl/","猫头鹰","The [owl] sleeps in the day."],["dragon","/ˈdræɡən/","龙","The [dragon] breathed fire."],["unicorn","/ˈjuːnɪkɔːn/","独角兽","A [unicorn] has one horn."],["toad","/təʊd/","蟾蜍","The [toad] jumped into the pond."],["bat","/bæt/","蝙蝠","A [bat] flew out of the cave."],["kitten","/ˈkɪtn/","小猫","The [kitten] drank some milk."]]),
move:mk("move",[["hurry","hurried","/ˈhʌri/","匆忙","Ben [hurried] to the bus stop."],["tiptoe","tiptoed","/ˈtɪptəʊ/","踮着脚走","She [tiptoed] past the sleeping cat."],["climb","climbed","/klaɪm/","攀爬","We [climbed] the hill."],["creep","crept","/kriːp/","悄悄爬行","The cat [crept] toward the bird."],["race","raced","/reɪs/","飞奔","The boys [raced] to the gate."],["wander","wandered","/ˈwɒndə(r)/","漫步","They [wandered] in the park."]],1),
act:mk("act",[["carry","carried","/ˈkæri/","搬运","Mum [carried] the heavy bag."],["polish","polished","/ˈpɒlɪʃ/","擦亮","He [polished] his shoes."],["examine","examined","/ɪɡˈzæmɪn/","仔细检查","The doctor [examined] my arm."],["collect","collected","/kəˈlekt/","收集","She [collected] shells on the beach."],["lift","lifted","/lɪft/","举起","Dad [lifted] the box."],["repair","repaired","/rɪˈpeə(r)/","修理","Grandpa [repaired] my bike."]],1),
say:mk("say",[["whisper","whispered","/ˈwɪspə(r)/","低声说","Lily [whispered] a secret to me."],["shout","shouted","/ʃaʊt/","大喊","The fans [shouted] loudly."],["explain","explained","/ɪkˈspleɪn/","解释","The teacher [explained] the rule."],["suggest","suggested","/səˈdʒest/","建议","Ravi [suggested] a new game."],["warn","warned","/wɔːn/","警告","Mum [warned] us about the ice."],["announce","announced","/əˈnaʊns/","宣布","The captain [announced] the winner."]],1)};
const ALL=Object.values(W).flat(),fm=x=>x.past||x.w;
const EM={owl:"🦉",dragon:"🐉",unicorn:"🦄",toad:"🐸",bat:"🦇",kitten:"🐱"};
const CH=[["Leo","he","his","里奥","他","他的"],["Mia","she","her","米娅","她","她的"],["Ben","he","his","本","他","他的"],["Nina","she","her","妮娜","她","她的"],["Ravi","he","his","拉维","他","他的"],["Lily","she","her","莉莉","她","她的"]];
const TIMES=["rainy morning","windy evening","sunny afternoon"],TEACH=["Hazel","Quill","Fern","Willow"];

const norm=s=>s.toLowerCase().replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim();
document.addEventListener("click",e=>{const t=e.target.closest("button,.flip-card,.vocab-word");if(!t)return;
if(t.id=="jumpBtn")return go($("jumpIn").value);
if(t.dataset.cn){const b=document.querySelector(".story-cn");b.style.display=b.style.display=="none"?"block":"none";return}
if(t.dataset.go)return go(t.dataset.go);
if(t.dataset.say&&!t.matches(".flip-card"))return speak(t.dataset.say,t.dataset.slow?.65:0);
if(t.matches(".flip-card")){if(t.dataset.say){speak(t.dataset.say);award(`s${S.page}_${t.dataset.say}`,5);return}t.classList.toggle("revealed");if(t.dataset.ci!=null){speak(unit(Math.floor((S.page-1)/10)).ws[t.dataset.ci].w);award(`v${S.page}_${t.dataset.ci}`,5)}return}
const c=t.closest(".quiz-card");if(!c)return;const fb=c.querySelector(".feedback-box");
if(t.matches(".opt-btn")){const it=CUR[c.dataset.qi],ok=t.dataset.v==it.a;c.querySelectorAll(".opt-btn").forEach(b=>b.classList.remove("correct","wrong"));t.classList.add(ok?"correct":"wrong");rec(it.s||(/^(What does "|Which word)/.test(it.q)?"vocab":"read"),ok);fb.className="feedback-box show "+(ok?"ok":"no");fb.textContent=ok?`✅ 答对啦！${award(`q${S.page}_${c.dataset.qi}`,15)} ${it.e?"解析："+it.e:""}`:`❌ 再想一想！${it.e?"提示："+it.e:""}`}
else if(t.matches(".word-chip")){if(t.disabled)return;t.disabled=true;t.style.opacity=.4;const s=JSON.parse(c.dataset.sel);s.push(t.dataset.w);c.dataset.sel=JSON.stringify(s);c.querySelector(".bdisp").textContent="已选："+s.join(" ");speak(t.dataset.w)}
else if(t.matches(".bclr")){c.dataset.sel="[]";c.querySelector(".bdisp").textContent="已选：";c.querySelectorAll(".word-chip").forEach(b=>{b.disabled=false;b.style.opacity=1});fb.className="feedback-box"}
else if(t.matches(".bchk")){const ok=JSON.parse(c.dataset.sel).join(" ")==c.dataset.ans;rec("grammar",ok);fb.className="feedback-box show "+(ok?"ok":"no");fb.textContent=ok?`⚡ 拼写成功！${award(`b${S.page}_${c.dataset.bi}`,20)} ${c.dataset.ans}`:`🪄 差一点！参考：${c.dataset.ans}`}
else if(t.matches(".tchk")){const i=c.querySelector(".ti"),ok=norm(i.value)==norm(i.dataset.ans);rec(c.dataset.s||"grammar",ok);fb.className="feedback-box show "+(ok?"ok":"no");fb.textContent=ok?`✅ 正确！${award(`t${S.page}_${c.dataset.ti}`,15)}`:`❌ 正确答案：${i.dataset.ans}`}});
$("yearSelect").addEventListener("change",e=>go(e.target.value*1000+1));
$("resetProgressBtn").addEventListener("click",()=>{S.page=1;S.stat={};S.pts=0;S.seen=new Set([1]);S.done=new Set();try{localStorage.removeItem(KEY)}catch(e){}render()});
load();render();

</script>
</body>
</html>
